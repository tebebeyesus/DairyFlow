name: dairyflow

# ── DairyFlow pilot deployment ────────────────────────────────────────────────
# One site, served over HTTPS on a free DuckDNS domain:
#     https://<your-name>.duckdns.org
#
# Caddy obtains and renews a Let's Encrypt certificate automatically — it just needs
# ports 80 + 443 open and the DuckDNS domain pointing at this server's public IP.
# SQL Server Express holds the database; the app auto-creates it on first start.
# See PILOT-DEPLOY.md for the full runbook.

services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dairyflow-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
      MSSQL_PID: "Express"            # free edition, 10 GB per database
    volumes:
      - sqldata:/var/opt/mssql        # database files persist here across redeploys
    ports:
      - "127.0.0.1:1433:1433"         # localhost only — NOT exposed to the internet
    restart: unless-stopped

  app:
    build: .
    image: dairyflow-app
    container_name: dairyflow-app
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__DefaultConnection: "Server=sql;Database=DairyFlow;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true"
      Jwt__Key: ${JWT_KEY}
      AllowedOrigins__0: "https://${DOMAIN}"
    depends_on: [sql]
    restart: unless-stopped           # retries until SQL is ready on first boot

  caddy:
    image: caddy:2
    container_name: dairyflow-caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data              # Let's Encrypt certs persist here
      - caddy_config:/config
    depends_on: [app]
    restart: unless-stopped

volumes:
  sqldata:
  caddy_data:
  caddy_config:
